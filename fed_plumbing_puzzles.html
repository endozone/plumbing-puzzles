<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rates Plumbing Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Give+You+Glory&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f3;
  --dot: #ddd8ce;
  --ink: #2d2d2d;
  --muted: #8a857a;
  --sky: #d4e4f7;
  --peach: #f7e2cc;
  --rose: #f2d4d4;
  --lilac: #ddd0f0;
  --sage: #cce6d0;
  --correct: #4caf7c;
  --wrong: #d06868;
  --slot-border: #b0aa9e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  font-family: 'Patrick Hand', cursive, system-ui;
  background: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.app {
  max-width: 440px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ---- HEADER ---- */
.puzzle-header { margin-bottom: 24px; }

.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.dot.active { background: var(--ink); border-color: var(--ink); }
.dot.done { background: var(--correct); border-color: var(--correct); }

.reset-btn {
  font-family: 'Patrick Hand', cursive;
  font-size: 0.95rem;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
}

.puzzle-title {
  font-family: 'Caveat', cursive;
  font-size: 1.8rem;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 4px;
}

.puzzle-sub {
  font-size: 1.05rem;
  color: var(--muted);
}

/* ---- FLOW / SLOTS ---- */
.flow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
}

.slot {
  width: 100%;
  min-height: 56px;
  border: 2.5px dashed var(--slot-border);
  border-radius: 4px 10px 6px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 16px;
  font-size: 1.05rem;
  color: var(--slot-border);
  text-align: center;
  transition: all 0.2s;
  position: relative;
  cursor: pointer;
  line-height: 1.35;
}

.slot.highlight {
  border-color: var(--ink);
  background: rgba(0,0,0,0.02);
}

.slot.filled {
  border-style: solid;
  border-color: #888;
  color: var(--ink);
  cursor: pointer;
}

.slot.filled.correct {
  border-color: var(--correct);
}

.slot .check {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  opacity: 0;
  transition: opacity 0.3s;
}

.slot.filled.correct .check {
  opacity: 1;
  color: var(--correct);
}

.slot.filled.wrong .check {
  opacity: 1;
  color: var(--wrong);
}

.slot-num {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Caveat', cursive;
  font-size: 1.1rem;
  color: var(--muted);
  font-weight: 700;
}

.slot.filled .slot-num { opacity: 0.4; }

.arrow-down {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  color: var(--muted);
}

.arrow-down svg {
  width: 20px;
  height: 24px;
}

/* ---- LABELS (for rate stack) ---- */
.flow-label {
  font-family: 'Caveat', cursive;
  font-size: 0.95rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 4px;
  font-weight: 700;
}

.flow-label.bottom { margin-top: 4px; margin-bottom: 0; }

/* ---- BANK ---- */
.bank-label {
  font-family: 'Caveat', cursive;
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 700;
}

.bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  min-height: 48px;
}

.piece {
  padding: 10px 14px;
  border: 2.5px solid #555;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  line-height: 1.3;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}

.piece:active { transform: scale(0.97); }

.piece.selected {
  box-shadow: 0 0 0 3px var(--ink);
  transform: scale(1.03);
}

.piece.placed {
  opacity: 0;
  pointer-events: none;
  position: absolute;
}

/* hand-drawn corners */
.hd-1 { border-radius: 4px 10px 6px 12px; transform: rotate(-0.6deg); }
.hd-2 { border-radius: 8px 4px 10px 6px; transform: rotate(0.4deg); }
.hd-3 { border-radius: 6px 12px 4px 8px; transform: rotate(-0.3deg); }
.hd-4 { border-radius: 10px 6px 8px 4px; transform: rotate(0.5deg); }
.hd-5 { border-radius: 4px 8px 12px 6px; transform: rotate(-0.7deg); }

.piece.selected.hd-1 { transform: rotate(-0.6deg) scale(1.03); }
.piece.selected.hd-2 { transform: rotate(0.4deg) scale(1.03); }
.piece.selected.hd-3 { transform: rotate(-0.3deg) scale(1.03); }
.piece.selected.hd-4 { transform: rotate(0.5deg) scale(1.03); }
.piece.selected.hd-5 { transform: rotate(-0.7deg) scale(1.03); }

/* ---- SHAKE ---- */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.shake { animation: shake 0.35s ease; }

/* ---- COMPLETION ---- */
.completion {
  text-align: center;
  padding: 16px 0 8px;
  margin-bottom: 16px;
}

.completion-text {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--correct);
}

/* ---- EXPLAINER ---- */
.explainer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
}

.explainer.show { max-height: 2000px; }

.explainer-title {
  font-family: 'Caveat', cursive;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.explain-item {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
  padding-left: 2px;
}

.explain-bar {
  width: 4px;
  border-radius: 2px;
  flex-shrink: 0;
}

.explain-body { flex: 1; }

.explain-step {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 1.05rem;
  margin-bottom: 2px;
}

.explain-text {
  font-size: 0.92rem;
  line-height: 1.55;
  color: #4a4740;
}

/* ---- NAV ---- */
.nav-btn {
  width: 100%;
  padding: 14px;
  font-family: 'Patrick Hand', cursive;
  font-size: 1.1rem;
  border: 2.5px solid #555;
  border-radius: 6px 12px 8px 10px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.12s;
}

.nav-btn:active { background: #eee8dd; }

/* ---- LANDING ---- */
.landing { padding-top: 20px; }

.landing-title {
  font-family: 'Caveat', cursive;
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 6px;
}

.landing-sub {
  font-size: 1.05rem;
  color: var(--muted);
  margin-bottom: 32px;
  line-height: 1.5;
}

.puzzle-card {
  border: 2.5px solid #555;
  padding: 16px 18px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.12s;
  display: flex;
  align-items: center;
  gap: 14px;
}

.puzzle-card:active { background: #eee8dd; }

.puzzle-card .card-num {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  width: 28px;
  text-align: center;
}

.puzzle-card .card-info h3 {
  font-family: 'Caveat', cursive;
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 2px;
}

.puzzle-card .card-info p {
  font-size: 0.88rem;
  color: var(--muted);
}

.puzzle-card .card-check {
  margin-left: auto;
  font-size: 1.2rem;
  color: var(--correct);
  opacity: 0;
}

.puzzle-card.completed .card-check { opacity: 1; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a20;
    --dot: #2a2a30;
    --ink: #e0ddd5;
    --muted: #7a7770;
    --slot-border: #5a5550;
    --sky: #2a3a50;
    --peach: #4a3828;
    --rose: #4a2e2e;
    --lilac: #3a3050;
    --sage: #2a4030;
  }
  body { background-color: var(--bg); }
  .explain-text { color: #aaa8a0; }
  .piece { border-color: #888; }
  .slot.filled { border-color: #888; }
  .nav-btn { border-color: #888; }
  .puzzle-card { border-color: #888; }
  .nav-btn:active, .puzzle-card:active { background: #2a2a30; }
}

:root[data-theme="dark"] {
  --bg: #1a1a20;
  --dot: #2a2a30;
  --ink: #e0ddd5;
  --muted: #7a7770;
  --slot-border: #5a5550;
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const COLORS = ['var(--sky)','var(--peach)','var(--rose)','var(--lilac)','var(--sage)'];
const HD = ['hd-1','hd-2','hd-3','hd-4','hd-5'];

const puzzles = [
  {
    title: 'How a dollar moves through the system',
    sub: 'The IORB arbitrage',
    type: 'flow',
    steps: [
      { id:'a', text:'FHLB issues overnight discount notes', color: 0,
        explain:'FHLBs raise short-term funding by issuing overnight discount notes to money market funds. The DN rate is typically below EFFR.' },
      { id:'b', text:'Uses excess cash to lend in Fed Funds', color: 1,
        explain:'When daily cash exceeds liquidity needs, FHLBs lend in the FF market. They prefer FF over repo because cash returns earlier the next day (~same day vs ~3pm T+1 for repo).' },
      { id:'c', text:'Foreign bank borrows in FF below IORB', color: 2,
        explain:'Foreign bank branches in the US borrow these funds. They dominate FF borrowing (~93%) because they face lighter regulation than domestic banks — no FDIC fees, softer leverage ratios.' },
      { id:'d', text:'Parks the cash at the Fed as reserves', color: 3,
        explain:'The foreign bank deposits the borrowed cash at the Fed, where it sits as reserve balances.' },
      { id:'e', text:'Earns IORB — the spread is profit', color: 4,
        explain:'The Fed pays IORB on those reserves. The spread between IORB and the FF borrowing rate is the arbitrage profit. Foreign banks keep more of it because they avoid FDIC insurance and face softer leverage requirements.' }
    ]
  },
  {
    title: 'Stack the rates: ceiling to floor',
    sub: 'How the Fed controls the target range',
    type: 'stack',
    topLabel: '← ceiling',
    bottomLabel: '← floor',
    steps: [
      { id:'a', text:'SRF / Discount Window — 4.50%', color: 2,
        explain:'The Standing Repo Facility lets dealers and banks borrow cash from the Fed against collateral. Set at the top of the range as a ceiling on repo rates. Stigma and balance sheet costs mean it\'s not a perfectly firm ceiling.' },
      { id:'b', text:'SOFR — 4.44%', color: 1,
        explain:'Secured Overnight Financing Rate — the broadest measure of Treasury collateralized repo. Not the Fed\'s target, but increasingly important since LIBOR transition. Would be the logical replacement if the Fed ever moved its target.' },
      { id:'c', text:'IORB — 4.40% (the magnet)', color: 3,
        explain:'Interest on Reserve Balances — the rate banks earn on reserves at the Fed. Called the "magnet" because banks won\'t lend below it, so it pulls other money market rates toward it. Set by the Board of Governors.' },
      { id:'d', text:'EFFR — 4.33% (policy target)', color: 0,
        explain:'Effective Federal Funds Rate — the Fed\'s primary policy target. Trades below IORB because FHLBs (the main FF lenders) can\'t earn IORB, so banks can borrow from them at a discount and pocket the spread.' },
      { id:'e', text:'ON RRP — 4.25%', color: 4,
        explain:'Overnight Reverse Repo — where MMFs and GSEs park excess cash with the Fed. Set at the bottom of the range as a floor. Not a perfect floor: some investors accept rates slightly below to maintain dealer relationships.' }
    ]
  },
  {
    title: 'What happens as QT continues',
    sub: 'From buffer to stress',
    type: 'flow',
    steps: [
      { id:'a', text:'Fed lets maturing securities roll off (up to the cap)', color: 0,
        explain:'The Fed allows up to $5bn UST and $35bn MBS to mature without reinvestment each month. MBS redemptions rarely hit the cap due to slow prepayments at high mortgage rates.' },
      { id:'b', text:'Balance sheet assets shrink', color: 1,
        explain:'As SOMA holdings decline, total Fed assets fall. The Fed has shrunk from ~$9tn peak to ~$6.7tn as of mid-2025.' },
      { id:'c', text:'Some liability must shrink by the same amount', color: 2,
        explain:'Assets = Liabilities. So for every dollar of securities that rolls off, some liability must also fall. The question is: which one?' },
      { id:'d', text:'ON RRP drains first — it\'s the buffer', color: 3,
        explain:'ON RRP absorbed most of the drain because banks preferred to hold reserves as precautionary buffers (against deposit flight, unrealized losses, stricter rules). ON RRP went from ~$2.5tn (late 2022) to near zero.' },
      { id:'e', text:'Buffer gone → reserves drain → funding stress risk', color: 4,
        explain:'With no more ON RRP cushion, every further dollar of QT hits bank reserves directly. That\'s when you risk repo rate spikes and funding market stress — similar to September 2019. BofA expects QT to stop by end of 2025.' }
    ]
  },
  {
    title: 'The basis trade ecosystem',
    sub: 'Who does what in UST futures',
    type: 'flow',
    steps: [
      { id:'a', text:'Asset manager wants Treasury index exposure', color: 0,
        explain:'Large asset managers need to replicate Treasury index returns in their portfolios. They could buy cash bonds outright, but there\'s a more capital-efficient way.' },
      { id:'b', text:'Buys futures instead of cash bonds (cheaper leverage)', color: 1,
        explain:'Futures provide leverage without repo, which has unfavorable accounting treatment. This frees up cash for money markets or credit, generating extra yield — especially attractive when the curve is inverted.' },
      { id:'c', text:'But someone must hold the actual cash bonds', color: 2,
        explain:'Futures are derivatives — they track bond prices but someone must own the underlying securities. The futures market can\'t exist without the cash market beneath it.' },
      { id:'d', text:'Hedge fund buys cash bonds, shorts futures (long basis)', color: 3,
        explain:'Leveraged funds step in: they buy the cash bond and sell futures against it. This is "going long the basis" — essentially buying the embedded delivery options. They profit if the options pay off or if they can carry to delivery.' },
      { id:'e', text:'Finances the cash bond purchase via repo', color: 4,
        explain:'The hedge fund funds its cash bond position in the repo market. This creates a funding dependency — and a constraint on how large these positions can grow. The official sector has flagged this leverage as a financial stability concern.' }
    ]
  }
];

// State
let currentPuzzle = -1; // -1 = landing
let selectedPiece = null;
let slotState = []; // array of piece IDs or null
let completedPuzzles = new Set();

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function arrowSVG() {
  return `<svg viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 1 Q 8 10, 10 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M5 14 L10 20 L15 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

function renderLanding() {
  currentPuzzle = -1;
  let html = `
    <div class="landing">
      <div class="landing-title">Rates Plumbing<br>Puzzles</div>
      <p class="landing-sub">Drag each step into the right place to complete the flowchart. Based on BofA's 2025 primers.</p>
  `;
  puzzles.forEach((p, i) => {
    const done = completedPuzzles.has(i);
    html += `
      <div class="puzzle-card ${HD[i]} ${done ? 'completed' : ''}" onclick="startPuzzle(${i})" style="background:${COLORS[i]}">
        <div class="card-num">${i + 1}</div>
        <div class="card-info">
          <h3>${p.title}</h3>
          <p>${p.sub}</p>
        </div>
        <div class="card-check">✓</div>
      </div>
    `;
  });
  html += '</div>';
  app.innerHTML = html;
}

function startPuzzle(idx) {
  currentPuzzle = idx;
  selectedPiece = null;
  slotState = new Array(puzzles[idx].steps.length).fill(null);
  renderPuzzle();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPuzzle() {
  const p = puzzles[currentPuzzle];
  const n = p.steps.length;
  const isComplete = slotState.every((s, i) => s === p.steps[i].id);

  let html = `<div class="puzzle-header">`;
  html += `<div class="progress-row"><div class="dots">`;
  puzzles.forEach((_, i) => {
    const cls = i === currentPuzzle ? 'active' : completedPuzzles.has(i) ? 'done' : '';
    html += `<div class="dot ${cls}" onclick="navPuzzle(${i})"></div>`;
  });
  html += `</div><button class="reset-btn" onclick="resetPuzzle()">reset</button></div>`;
  html += `<div class="puzzle-title">${p.title}</div>`;
  html += `<div class="puzzle-sub">${p.sub}</div>`;
  html += `</div>`;

  // Flow
  html += `<div class="flow">`;
  if (p.topLabel) html += `<div class="flow-label">${p.topLabel}</div>`;
  for (let i = 0; i < n; i++) {
    const filled = slotState[i] !== null;
    const correct = filled && slotState[i] === p.steps[i].id;
    const wrong = filled && !correct;
    const filledStep = filled ? p.steps.find(s => s.id === slotState[i]) : null;
    const bgColor = filledStep ? COLORS[filledStep.color] : 'transparent';
    const cls = `slot ${filled ? 'filled' : ''} ${correct ? 'correct' : ''} ${wrong ? 'wrong' : ''} ${(!filled && selectedPiece) ? 'highlight' : ''}`;

    html += `<div class="${cls}" onclick="tapSlot(${i})" style="${filled ? 'background:' + bgColor : ''}">`;
    html += `<span class="slot-num">${i + 1}</span>`;
    html += filled ? filledStep.text : '&nbsp;';
    html += `<span class="check">${correct ? '✓' : wrong ? '✗' : ''}</span>`;
    html += `</div>`;

    if (i < n - 1) html += `<div class="arrow-down">${arrowSVG()}</div>`;
  }
  if (p.bottomLabel) html += `<div class="flow-label bottom">${p.bottomLabel}</div>`;
  html += `</div>`;

  // Bank
  const placedIds = slotState.filter(s => s !== null);
  const available = p.steps.filter(s => !placedIds.includes(s.id));
  const shuffled = isComplete ? [] : shuffle(available);

  if (!isComplete && shuffled.length > 0) {
    html += `<div class="bank-label">pieces</div>`;
    html += `<div class="bank">`;
    shuffled.forEach((s, i) => {
      const sel = selectedPiece === s.id ? 'selected' : '';
      const hd = HD[s.color];
      html += `<div class="piece ${hd} ${sel}" onclick="tapPiece('${s.id}')" style="background:${COLORS[s.color]}">${s.text}</div>`;
    });
    html += `</div>`;
  } else if (!isComplete) {
    html += `<div class="bank"></div>`;
  }

  // Completion
  if (isComplete) {
    completedPuzzles.add(currentPuzzle);
    html += `<div class="completion"><div class="completion-text">✓ Nailed it</div></div>`;
    html += `<div class="explainer show">`;
    html += `<div class="explainer-title">How it works</div>`;
    p.steps.forEach((s, i) => {
      html += `<div class="explain-item">
        <div class="explain-bar" style="background:${COLORS[s.color]}"></div>
        <div class="explain-body">
          <div class="explain-step">${i + 1}. ${s.text}</div>
          <div class="explain-text">${s.explain}</div>
        </div>
      </div>`;
    });
    html += `</div>`;

    if (currentPuzzle < puzzles.length - 1) {
      html += `<button class="nav-btn ${HD[3]}" onclick="startPuzzle(${currentPuzzle + 1})">Next puzzle →</button>`;
    } else {
      html += `<button class="nav-btn ${HD[3]}" onclick="renderLanding()">Back to puzzles</button>`;
    }
  }

  html += `<button class="nav-btn ${HD[1]}" onclick="renderLanding()" style="margin-top:8px; font-size:0.95rem; color:var(--muted); border-color:var(--slot-border)">← all puzzles</button>`;

  app.innerHTML = html;
}

function tapPiece(id) {
  if (selectedPiece === id) {
    selectedPiece = null;
  } else {
    selectedPiece = id;
  }
  renderPuzzle();
}

function tapSlot(idx) {
  const p = puzzles[currentPuzzle];

  // If slot is filled, remove piece back to bank
  if (slotState[idx] !== null) {
    slotState[idx] = null;
    selectedPiece = null;
    renderPuzzle();
    return;
  }

  // If no piece selected, do nothing
  if (!selectedPiece) return;

  // Place piece
  const correct = selectedPiece === p.steps[idx].id;
  if (correct) {
    slotState[idx] = selectedPiece;
    selectedPiece = null;
    renderPuzzle();
  } else {
    // Wrong — shake the slot
    slotState[idx] = selectedPiece; // temporarily place
    selectedPiece = null;
    renderPuzzle();

    // Show shake then remove
    const slots = document.querySelectorAll('.slot');
    const slot = slots[idx];
    if (slot) {
      slot.classList.add('shake');
      setTimeout(() => {
        slotState[idx] = null;
        renderPuzzle();
      }, 400);
    }
  }
}

function resetPuzzle() {
  slotState = new Array(puzzles[currentPuzzle].steps.length).fill(null);
  selectedPiece = null;
  renderPuzzle();
}

function navPuzzle(idx) {
  startPuzzle(idx);
}

// Init
renderLanding();
</script>
</body>
</html>
