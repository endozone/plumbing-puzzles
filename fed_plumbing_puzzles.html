<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rates Plumbing Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&family=Caveat&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8faf3;
  --dot: #ddd8ce;
  --ink: #2d2d2d;
  --muted: #8a857a;
  --sky: #d4e4f7;
  --peach: #f7e2cc;
  --rose: #f2d4d4;
  --lilac: #ddd0f0;
  --sage: #cce6d0;
  --correct: #4caf7c;
  --wrong: #d06868;
  --slot-border: #b0aa9e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  font-family: 'Patrick Hand', cursive, system-ui;
  background: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.app {
  max-width: 440px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

@media (min-width: 700px) {
  .app {
    max-width: 760px;
    padding: 40px 32px 56px;
  }
  .puzzle-title { font-size: 2.6rem; }
  .landing-title { font-size: 3.4rem; }
}

/* ---- HEADER ---- */
.puzzle-header { margin-bottom: 24px; }

.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: 'Patrick Hand', cursive;
  font-size: 0.95rem;
  color: var(--ink);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
}

.back-btn svg {
  width: 16px;
  height: 16px;
}

.reset-btn {
  font-family: 'Patrick Hand', cursive;
  font-size: 0.95rem;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
}

.puzzle-title {
  font-family: 'Beth Ellen', cursive;
  font-size: 2.1rem;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 10px;
}

.puzzle-sub {
  font-size: 1.05rem;
  color: var(--muted);
}

/* ---- FLOW / SLOTS ---- */
.flow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
}

.slot {
  width: 100%;
  min-height: 56px;
  border: 2.5px dashed var(--slot-border);
  border-radius: 4px 10px 6px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 16px;
  font-size: 1.05rem;
  color: var(--slot-border);
  text-align: center;
  transition: all 0.2s;
  position: relative;
  cursor: pointer;
  line-height: 1.35;
}

.slot.highlight {
  border-color: var(--ink);
  background: rgba(0,0,0,0.02);
}

.slot.filled {
  border-style: solid;
  border-color: #888;
  color: var(--ink);
  cursor: pointer;
}

.slot.filled.correct {
  border-color: var(--correct);
}

.slot .check {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  opacity: 0;
  transition: opacity 0.3s;
}

.slot.filled.correct .check {
  opacity: 1;
  color: var(--correct);
}

.slot.filled.wrong .check {
  opacity: 1;
  color: var(--wrong);
}

.slot-num {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Caveat', cursive;
  font-size: 1.1rem;
  color: var(--muted);
  font-weight: 700;
}

.slot.filled .slot-num { opacity: 0.4; }

.arrow-down {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  color: var(--muted);
}

.arrow-down svg {
  width: 20px;
  height: 24px;
}

/* ---- LABELS (for rate stack) ---- */
.flow-label {
  font-family: 'Caveat', cursive;
  font-size: 0.95rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 4px;
  font-weight: 700;
}

.flow-label.bottom { margin-top: 4px; margin-bottom: 0; }

/* ---- BANK ---- */
.bank-label {
  font-family: 'Caveat', cursive;
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 700;
}

.bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
  min-height: 48px;
}

.piece {
  padding: 10px 14px;
  border: 2.5px solid #555;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  line-height: 1.3;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}

.piece:active { transform: scale(0.97); }

.piece.selected {
  box-shadow: 0 0 0 3px var(--ink);
  transform: scale(1.03);
}

.piece.placed {
  opacity: 0;
  pointer-events: none;
  position: absolute;
}

/* hand-drawn corners */
.hd-1 { border-radius: 4px 10px 6px 12px; transform: rotate(-0.6deg); }
.hd-2 { border-radius: 8px 4px 10px 6px; transform: rotate(0.4deg); }
.hd-3 { border-radius: 6px 12px 4px 8px; transform: rotate(-0.3deg); }
.hd-4 { border-radius: 10px 6px 8px 4px; transform: rotate(0.5deg); }
.hd-5 { border-radius: 4px 8px 12px 6px; transform: rotate(-0.7deg); }

.piece.selected.hd-1 { transform: rotate(-0.6deg) scale(1.03); }
.piece.selected.hd-2 { transform: rotate(0.4deg) scale(1.03); }
.piece.selected.hd-3 { transform: rotate(-0.3deg) scale(1.03); }
.piece.selected.hd-4 { transform: rotate(0.5deg) scale(1.03); }
.piece.selected.hd-5 { transform: rotate(-0.7deg) scale(1.03); }

/* ---- SHAKE ---- */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.shake { animation: shake 0.35s ease; }

/* ---- COMPLETION ---- */
.completion {
  text-align: center;
  padding: 16px 0 8px;
  margin-bottom: 16px;
}

.completion-text {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--correct);
}

/* ---- EXPLAINER ---- */
.explainer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
}

.explainer.show { max-height: 2000px; }

.explainer-title {
  font-family: 'Caveat', cursive;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.explain-item {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
  padding-left: 2px;
}

.explain-bar {
  width: 4px;
  border-radius: 2px;
  flex-shrink: 0;
}

.explain-body { flex: 1; }

.explain-step {
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 1.05rem;
  margin-bottom: 2px;
}

.explain-text {
  font-size: 0.92rem;
  line-height: 1.55;
  color: #4a4740;
}

/* ---- NAV ---- */
.nav-btn {
  width: 100%;
  padding: 14px;
  font-family: 'Patrick Hand', cursive;
  font-size: 1.1rem;
  border: 2.5px solid #555;
  border-radius: 6px 12px 8px 10px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.12s;
}

.nav-btn:active { background: #eee8dd; }

/* ---- LANDING ---- */
.landing { padding-top: 20px; }

.landing-title {
  font-family: 'Beth Ellen', cursive;
  font-size: 36px;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 28px;
}

.landing-sub {
  font-size: 1.05rem;
  color: var(--muted);
  margin-bottom: 32px;
  line-height: 1.5;
}

.puzzle-card {
  border: 2.5px solid #555;
  padding: 16px 18px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: background 0.12s;
  display: flex;
  align-items: center;
  gap: 14px;
}

.puzzle-card:active { background: #eee8dd; }

.puzzle-card .card-num {
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  width: 28px;
  text-align: center;
}

.puzzle-card .card-info h3 {
  font-family: 'Beth Ellen', cursive;
  font-size: 1.5rem;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 4px;
}

.puzzle-card .card-info p {
  font-size: 0.88rem;
  color: var(--muted);
}

.puzzle-card .card-check {
  margin-left: auto;
  font-size: 1.2rem;
  color: var(--correct);
  opacity: 0;
}

.puzzle-card.completed .card-check { opacity: 1; }

</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const COLORS = ['var(--sky)','var(--peach)','var(--rose)','var(--lilac)','var(--sage)'];
const HD = ['hd-1','hd-2','hd-3','hd-4','hd-5'];

const puzzles = [
  {
    title: 'The fed funds funding circuit',
    sub: 'What actually drives the overnight lending market',
    type: 'flow',
    steps: [
      { id:'a', text:'Federal Home Loan Banks (FHLBs) issue overnight discount notes', color: 0,
        explain:'FHLBs are a system of 11 government-sponsored cooperative banks that exist to support mortgage lending across the U.S. To fund their daily operations, they issue overnight discount notes - essentially short-term IOUs - sold mainly to money market funds. The interest rate they pay on these notes is typically below the Federal Funds Rate.' },
      { id:'b', text:'Uses excess cash to lend in Fed Funds', color: 1,
        explain:'The Fed Funds market is where financial institutions lend cash to each other overnight, without requiring collateral. When an FHLB has more cash on hand than it needs for the day, it lends the surplus here. They can’t leave cash at the Fed because they aren’t banks. They’re "government-sponsored enterprises", and the Fed only pays interest on reserves to depository institutions. So any positive return the FHLB can earn in the Fed Funds market beats the alternative (zero). FHLBs make up roughly 95% of all lending in this market.' },
      { id:'c', text:'Foreign bank borrows in FF below interest on reserve balances (IORB)', color: 2,
        explain:'Branches of large international banks operating in the U.S. (Barclays, Deutsche Bank, etc.) are the dominant borrowers in this market, making up roughly 93% of volume. They borrow at the Fed Funds Rate, which is lower than the interest rate the Fed pays on reserves (called IORB [Interest on Reserve Balances]). Foreign banks are more profitable at this than US domestic banks for two reasons: they don’t pay FDIC deposit insurance fees (their U.S. deposits aren’t covered by FDIC insurance), and their home-country regulators impose lighter leverage requirements than U.S. regulators do.' },
      { id:'d', text:'Parks the cash at the Fed as reserves', color: 3,
        explain:'Reserves are cash balances that banks hold at the Federal Reserve. The foreign bank takes the cash it just borrowed in the Fed Funds market and deposits it at the Fed, where it sits overnight.' },
      { id:'e', text:'Earns IORB', color: 4,
        explain:'The foreign bank then earns IORB on its reserves but only pays the lower Fed Funds Rate to borrow. The difference is essentially risk-free profit. This arbitrage is what keeps the Fed Funds Rate anchored close to (but slightly below) IORB, which is how the Fed maintains control over short-term interest rates.' }
    ]
  },
  {
    title: 'Stack the rates: ceiling to floor',
    sub: 'How the Fed keeps short-term rates in the target range',
    type: 'stack',
    topLabel: 'ceiling',
    bottomLabel: 'floor',
    steps: [
      { id:'a', text:'Standing Repo Facility (SRF)', color: 2,
        explain:'The SFR is where banks and primary dealers (large financial firms that trade directly with the Fed) can borrow cash overnight from the Fed by pledging Treasury bonds as collateral. If short-term market rates spike above this level, banks can just borrow from the Fed instead, which puts a cap on how high rates can go. In practice, it’s not a perfectly firm ceiling: banks are reluctant to use it because there’s a stigma attached to borrowing from the central bank (i.e. it signals you couldn’t get funding in the open market).' },
      { id:'b', text:'Secured Overnight Financing Rate (SOFR)', color: 1,
        explain:'SOFR measures the average cost of borrowing cash overnight using Treasury bonds as collateral. “Secured” means the borrower posts collateral, unlike fed funds lending which is unsecured. You may have heard of London Interbank Offered Rate (LIBOR), the old benchmark rate that was phrased out in 2021 after a manipulation scandal. SOFR is essentially its replacement. Most new loans, mortgages, derivatives, and financial contracts now reference SOFR. It’s not the Fed’s official policy target, but it’s become one of the most important interest rates in the financial system.' },
      { id:'c', text:'Interest on Reserve Balances (IORB)', color: 3,
        explain:'This is arguably the Fed’s most important policy tool. IORB is the interest rate the Fed pays banks for holding cash at the Federal Reserve. It acts like a magnet for all other short-term rates. Since banks can always earn IORB risk-free by parking cash at the Fed, they won’t lend money to anyone else for less than that. This pulls every other overnight rate in the market toward IORB. It’s only available to depository institutions (i.e. banks), not to money market funds, FHLBs, or other financial entities.' },
      { id:'d', text:'Effective Federal Funds Rate (EFFR)', color: 0,
        explain:'This is what is referred to when the Fed "raises/lowers rates". The EFFR is calculated daily as the median rate on overnight unsecured lending between financial institutions. It’s the Fed’s official policy target. It typically prints a few basis points below IORB because the main lenders in this market - FHLBs - can’t earn IORB themselves. So borrowing banks can get funds from them at a slight discount and still profit by depositing the cash at the Fed to earn IORB.' },
      { id:'e', text:'Overnight Reverse Repo (ON RRP)', color: 4,
        explain:'The ON RRP is a facility where money market funds and other eligible entities can lend cash to the Fed overnight, receiving Treasury bonds as collateral in return. It acts as a floor on short-term rates. If rates in the open market drop too low, these entities can always park their cash with the Fed at the ON RRP rate instead. Since December 2024, the Fed has deliberately set this rate at the very bottom of the range to discourage overuse, since the Fed prefers cash flowing through private markets rather than sitting at the central bank.' }
    ]
  },
  {
    title: 'What happens under quantitative tightening',
    sub: 'Policy changes that shrink the Fed’s balance sheet',
    type: 'flow',
    steps: [
      { id:'a', text:'Fed lets maturing securities roll off', color: 0,
        explain:'After the pandemic, the Fed bought trillions of dollars in Treasury bonds and mortgage-backed securities (MBS) to pump cash into the economy. This is called quantitative easing, or QE. Under QE, the Fed creates new money and uses it to buy bonds, pushing cash into the financial system and lowering long-term interest rates. Quantitative tightening (QT) is the opposite: as those bonds mature, the Fed just lets them expire. The Fed controls the pace with monthly caps.' },
      { id:'b', text:'Balance sheet assets shrink', color: 1,
        explain:'As bonds mature and aren’t replaced, the Fed’s total assets decline. The balance sheet peaked at about $9 trillion and has come down to roughly $6.7 trillion by mid-2025. The assets are mostly the Treasury bonds and mortgage-backed securities the Fed bought during QE, held in a portfolio called the SOMA (System Open Market Account).' },
      { id:'c', text:'Some liability must shrink by the same amount', color: 2,
        explain:'A balance sheet is balanced, with assets equalling liabilities. So when assets shrink by a dollar, some liability must also shrink by a dollar. The Fed’s main liabilities are: bank reserves (cash that banks hold at the Fed), currency in circulation (physical dollar bills), the Treasury General Account or TGA (essentially the US government’s checking account at the Fed), and the ON RRP facility. The critical question for markets is: which of these absorbs the drain?' },
      { id:'d', text:'ON RRP drains first', color: 3,
        explain:'In practice, almost all of the shrinkage came from the ON RRP facility, not from bank reserves. ON RRP balances dropped from about $2.5 trillion in late 2022 to near zero. Why did reserves stay stable? Banks chose to hold onto their cash as precautionary cushions — partly because of the 2023 regional bank failures (SVB, Signature Bank), unrealized losses on their bond portfolios from the rate hiking cycle, and stricter liquidity requirements from regulators. Because the drain came from ON RRP rather than reserves, the banking system stayed comfortable even as the Fed’s balance sheet shrank significantly.' },
      { id:'e', text:'Funding stress risk occurs', color: 4,
        explain:'Once the ON RRP buffer is fully depleted, every additional dollar of QT comes directly out of bank reserves. Reserves are what banks use for daily payments and to meet regulatory liquidity requirements, so draining them gets uncomfortable quickly. The cautionary precedent is September 2019, when the Fed drained too many reserves and overnight lending rates spiked unexpectedly, forcing the Fed to restart emergency lending operations. BofA’s rates team estimates QT will need to stop by the end of 2025 to avoid a similar episode of funding market stress.' }
    ]
  },
  {
    title: 'The basis trade ecosystem',
    sub: 'Who does what in UST futures',
    type: 'flow',
    steps: [
      { id:'a', text:'Asset manager wants Treasury index exposure', color: 0,
        explain:'Large investment managers (pension funds, mutual funds, index funds) need to hold Treasury bonds in their portfolios to match bond market benchmarks. The straightforward approach would be to simply buy the bonds. But there’s a more capital-efficient option: futures contracts (standardized agreements to buy or sell a Treasury bond at a set price on a future date).' },
      { id:'b', text:'Buys futures instead of cash bonds', color: 1,
        explain:'Treasury futures let you get the same market exposure as holding the actual bonds, but without paying the full price upfront. You only need to post a small margin deposit (a fraction of the bond’s face value) at the exchange. This frees up cash that can be invested elsewhere for extra return, which is particularly attractive when short-term interest rates are high. It also avoids the accounting and operational complexity of financing actual bond positions. The trade-off: by holding futures instead of the actual bonds in the index, the asset manager takes on what’s called “basis risk” (the possibility that futures and cash bond prices don’t move in perfect lockstep).' },
      { id:'c', text:'But someone must hold the actual cash bonds', color: 2,
        explain:'Futures are derivatives - they derive their value from underlying Treasury bonds, but they aren’t the bonds themselves. Every futures contract has a buyer and a seller, and at the end of its life, actual bonds need to change hands. So somewhere in the chain, someone has to own and finance the real Treasury securities. This creates an opening for an investor who is willing to hold the actual bonds and take the other side of the trade.' },
      { id:'d', text:'Hedge fund buys cash bonds, shorts futures (long basis)', color: 3,
        explain:'Hedge funds step in as the natural counterparty. They buy the actual Treasury bonds and simultaneously sell futures contracts against them. This paired position is called “going long the basis”, with the “basis” being the price gap between the cash bond and the futures contract. The hedge fund is betting it can earn a small but highly leveraged return by carrying this position to the futures delivery date. They’re roughly equal in size to the asset managers on the other side.' },
      { id:'e', text:'Finances the cash bond purchase via repo', color: 4,
        explain:'The hedge fund funds its cash bond position in the repo (repurchase) market. It pledges the bonds it just bought as collateral and receives a short-term cash loan in return, typically rolled overnight. This creates leverage and a funding dependency. If borrowing costs spike or lenders pull back, the hedge fund could be forced to sell quickly. This is why financial regulators, including the Fed, the SEC, and the Treasury Department, have flagged the basis trade as a potential financial stability risk: a large amount of leveraged money depends on short-term funding remaining cheap and available.' }
    ]
  }
];

// State
let currentPuzzle = -1; // -1 = landing
let selectedPiece = null;
let slotState = []; // array of piece IDs or null
let completedPuzzles = new Set();

const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function arrowSVG() {
  return `<svg viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 1 Q 8 10, 10 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M5 14 L10 20 L15 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

function backArrowSVG() {
  return `<svg viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 1 L1 8 L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M1 8 L19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>`;
}

function renderLanding() {
  currentPuzzle = -1;
  let html = `
    <div class="landing">
      <div class="landing-title">Rates Plumbing<br>Puzzles</div>
  `;
  puzzles.forEach((p, i) => {
    const done = completedPuzzles.has(i);
    html += `
      <div class="puzzle-card ${HD[i]} ${done ? 'completed' : ''}" onclick="startPuzzle(${i})" style="background:${COLORS[i]}">
        <div class="card-num">${i + 1}</div>
        <div class="card-info">
          <h3>${p.title}</h3>
          <p>${p.sub}</p>
        </div>
        <div class="card-check">✓</div>
      </div>
    `;
  });
  html += '</div>';
  app.innerHTML = html;
}

function startPuzzle(idx) {
  currentPuzzle = idx;
  selectedPiece = null;
  slotState = new Array(puzzles[idx].steps.length).fill(null);
  renderPuzzle();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPuzzle() {
  const p = puzzles[currentPuzzle];
  const n = p.steps.length;
  const isComplete = slotState.every((s, i) => s === p.steps[i].id);

  let html = `<div class="puzzle-header">`;
  html += `<div class="progress-row">`;
  html += `<button class="back-btn" onclick="renderLanding()">${backArrowSVG()} Back</button>`;
  html += `<div class="dots">`;
  puzzles.forEach((_, i) => {
    const cls = i === currentPuzzle ? 'active' : completedPuzzles.has(i) ? 'done' : '';
    html += `<div class="dot ${cls}" onclick="navPuzzle(${i})"></div>`;
  });
  html += `</div><button class="reset-btn" onclick="resetPuzzle()">Reset</button></div>`;
  html += `<div class="puzzle-title">${p.title}</div>`;
  html += `<div class="puzzle-sub">${p.sub}</div>`;
  html += `</div>`;

  // Flow
  html += `<div class="flow">`;
  if (p.topLabel) html += `<div class="flow-label">${p.topLabel}</div>`;
  for (let i = 0; i < n; i++) {
    const filled = slotState[i] !== null;
    const correct = filled && slotState[i] === p.steps[i].id;
    const wrong = filled && !correct;
    const filledStep = filled ? p.steps.find(s => s.id === slotState[i]) : null;
    const bgColor = filledStep ? COLORS[filledStep.color] : 'transparent';
    const cls = `slot ${filled ? 'filled' : ''} ${correct ? 'correct' : ''} ${wrong ? 'wrong' : ''} ${(!filled && selectedPiece) ? 'highlight' : ''}`;

    html += `<div class="${cls}" onclick="tapSlot(${i})" style="${filled ? 'background:' + bgColor : ''}">`;
    html += `<span class="slot-num">${i + 1}</span>`;
    html += filled ? filledStep.text : '&nbsp;';
    html += `<span class="check">${correct ? '✓' : wrong ? '✗' : ''}</span>`;
    html += `</div>`;

    if (i < n - 1) html += `<div class="arrow-down">${arrowSVG()}</div>`;
  }
  if (p.bottomLabel) html += `<div class="flow-label bottom">${p.bottomLabel}</div>`;
  html += `</div>`;

  // Bank
  const placedIds = slotState.filter(s => s !== null);
  const available = p.steps.filter(s => !placedIds.includes(s.id));
  const shuffled = isComplete ? [] : shuffle(available);

  if (!isComplete && shuffled.length > 0) {
    html += `<div class="bank-label">Pieces</div>`;
    html += `<div class="bank">`;
    shuffled.forEach((s, i) => {
      const sel = selectedPiece === s.id ? 'selected' : '';
      const hd = HD[s.color];
      html += `<div class="piece ${hd} ${sel}" onclick="tapPiece('${s.id}')" style="background:${COLORS[s.color]}">${s.text}</div>`;
    });
    html += `</div>`;
  } else if (!isComplete) {
    html += `<div class="bank"></div>`;
  }

  // Completion
  if (isComplete) {
    completedPuzzles.add(currentPuzzle);
    html += `<div class="completion"><div class="completion-text">✓ Nailed it</div></div>`;
    html += `<div class="explainer show">`;
    html += `<div class="explainer-title">How it works</div>`;
    p.steps.forEach((s, i) => {
      html += `<div class="explain-item">
        <div class="explain-bar" style="background:${COLORS[s.color]}"></div>
        <div class="explain-body">
          <div class="explain-step">${i + 1}. ${s.text}</div>
          <div class="explain-text">${s.explain}</div>
        </div>
      </div>`;
    });
    html += `</div>`;

    if (currentPuzzle < puzzles.length - 1) {
      html += `<button class="nav-btn ${HD[3]}" onclick="startPuzzle(${currentPuzzle + 1})">Next puzzle →</button>`;
    } else {
      html += `<button class="nav-btn ${HD[3]}" onclick="renderLanding()">Back to puzzles</button>`;
    }
  }

  app.innerHTML = html;
}

function tapPiece(id) {
  if (selectedPiece === id) {
    selectedPiece = null;
  } else {
    selectedPiece = id;
  }
  renderPuzzle();
}

function tapSlot(idx) {
  const p = puzzles[currentPuzzle];

  // If slot is filled, remove piece back to bank
  if (slotState[idx] !== null) {
    slotState[idx] = null;
    selectedPiece = null;
    renderPuzzle();
    return;
  }

  // If no piece selected, do nothing
  if (!selectedPiece) return;

  // Place piece
  const correct = selectedPiece === p.steps[idx].id;
  if (correct) {
    slotState[idx] = selectedPiece;
    selectedPiece = null;
    renderPuzzle();
  } else {
    // Wrong — shake the slot
    slotState[idx] = selectedPiece; // temporarily place
    selectedPiece = null;
    renderPuzzle();

    // Show shake then remove
    const slots = document.querySelectorAll('.slot');
    const slot = slots[idx];
    if (slot) {
      slot.classList.add('shake');
      setTimeout(() => {
        slotState[idx] = null;
        renderPuzzle();
      }, 400);
    }
  }
}

function resetPuzzle() {
  slotState = new Array(puzzles[currentPuzzle].steps.length).fill(null);
  selectedPiece = null;
  renderPuzzle();
}

function navPuzzle(idx) {
  startPuzzle(idx);
}

// Init
renderLanding();
</script>
</body>
</html>
